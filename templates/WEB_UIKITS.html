<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Video + Medical Form</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      #container {
        display: flex;
        height: 100vh;
        width: 100vw;
      }

      #root {
        flex: 3; /* 75% */
        height: 100%;
      }

      #sidePanel {
        flex: 1; /* 25% */
        padding: 20px;
        border-left: 1px solid #ddd;
        background-color: #f9f9f9;
        overflow-y: auto;
      }

      #sidePanel h2 {
        margin-top: 0;
      }

      #sidePanel form {
        display: flex;
        flex-direction: column;
      }

      #sidePanel label {
        margin: 10px 0 5px;
        font-weight: bold;
      }

      #sidePanel input,
      #sidePanel textarea {
        padding: 8px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
        resize: vertical;
      }

      #sidePanel button {
        margin-top: 15px;
        padding: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      #sidePanel button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>

  <body>
    <div id="container">
      <div id="root"></div>
      <div id="sidePanel">
        <h2>Send Medical Info</h2>
        <form id="medicalForm">
          <label for="name">Your Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Enter your name"
          />

          <label for="email">Recipient Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Enter recipient's email"
          />

          <label for="symptoms">Symptoms</label>
          <textarea
            id="symptoms"
            name="symptoms"
            rows="4"
            required
            placeholder="Describe symptoms"
          ></textarea>

          <label for="medication">Medication</label>
          <textarea
            id="medication"
            name="medication"
            rows="4"
            required
            placeholder="List medication"
          ></textarea>

          <button type="submit">Send Email</button>
        </form>
      </div>
    </div>

    <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
    <script>
      window.onload = function () {
        function getUrlParams(url) {
          let urlStr = url.split("?")[1];
          const urlSearchParams = new URLSearchParams(urlStr);
          const result = Object.fromEntries(urlSearchParams.entries());
          return result;
        }

        const roomID =
          getUrlParams(window.location.href)["roomID"] ||
          Math.floor(Math.random() * 10000) + "";
        const userID = Math.floor(Math.random() * 10000) + "";
        const userName = "userName" + userID;
        const appID = 1659137012;
        const serverSecret = "9ae40ced14356f368ca325d4e653eef0";
        const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(
          appID,
          serverSecret,
          roomID,
          userID,
          userName
        );

        const zp = ZegoUIKitPrebuilt.create(kitToken);
        zp.joinRoom({
          container: document.querySelector("#root"),
          sharedLinks: [
            {
              name: "Personal link",
              url:
                window.location.protocol +
                "//" +
                window.location.host +
                window.location.pathname +
                "?roomID=" +
                roomID,
            },
          ],
          scenario: {
            mode: ZegoUIKitPrebuilt.VideoConference,
          },
          turnOnMicrophoneWhenJoining: true,
          turnOnCameraWhenJoining: true,
          showMyCameraToggleButton: true,
          showMyMicrophoneToggleButton: true,
          showAudioVideoSettingsButton: true,
          showScreenSharingButton: true,
          showTextChat: true,
          showUserList: true,
          maxUsers: 2,
          layout: "Auto",
          showLayoutButton: false,
        });

        // Handle form submit - open Gmail in a new tab
        document
          .getElementById("medicalForm")
          .addEventListener("submit", function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const symptoms = document.getElementById("symptoms").value.trim();
            const medication = document
              .getElementById("medication")
              .value.trim();

            const subject = encodeURIComponent(
              "Medical Information from " + name
            );
            const body = encodeURIComponent(
              `Name: ${name}\n\nSymptoms:\n${symptoms}\n\nMedication:\n${medication}`
            );

            // Open Gmail compose in new tab
            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${email}&su=${subject}&body=${body}`;
            window.open(gmailUrl, "_blank");
          });
      };
    </script>
  </body>
</html>
